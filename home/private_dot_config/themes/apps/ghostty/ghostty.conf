# Ghostty colours from the active theme palette, rendered by the theme script.
# Turn off in ~/.config/themes/settings.json to keep Ghostty's own theme.

background = {{palette.surface}}
foreground = {{palette.text}}
selection-background = {{palette.outline}}
selection-foreground = {{palette.text}}
cursor-color = {{palette.accent}}
cursor-text = {{palette.surface}}

split-divider-color = {{palette.accent}}

palette = 0={{palette.term0}}
palette = 1={{palette.term1}}
palette = 2={{palette.term2}}
palette = 3={{palette.term3}}
palette = 4={{palette.term4}}
palette = 5={{palette.term5}}
palette = 6={{palette.term6}}
palette = 7={{palette.term7}}
palette = 8={{palette.term8}}
palette = 9={{palette.term9}}
palette = 10={{palette.term10}}
palette = 11={{palette.term11}}
palette = 12={{palette.term12}}
palette = 13={{palette.term13}}
palette = 14={{palette.term14}}
palette = 15={{palette.term15}}
