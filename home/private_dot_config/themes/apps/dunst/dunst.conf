# dunst colours from the active theme palette, rendered by the theme script and
# loaded as ~/.config/dunst/dunstrc.d/50-theme.conf (overrides dunstrc).
# Turn off in ~/.config/themes/settings.json.

[global]
    frame_width = 2
    frame_color = "{{palette.accent}}"
    separator_color = frame
    highlight = "{{palette.accent}}"

[urgency_low]
    background = "{{palette.surface}}"
    foreground = "{{palette.text_mute}}"
    frame_color = "{{palette.accent}}"

[urgency_normal]
    background = "{{palette.surface}}"
    foreground = "{{palette.text}}"
    frame_color = "{{palette.accent}}"

[urgency_critical]
    background = "{{palette.surface}}"
    foreground = "{{palette.text}}"
    frame_color = "{{palette.crit}}"
