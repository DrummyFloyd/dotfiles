#!/usr/bin/env bash

# btop rewrites this file on exit (UI tweaks, new keys on upgrade),
# so only enforce a few preferences and leave the rest to btop.

awk '
  BEGIN {
    want["color_theme"] = "\"/usr/share/btop/themes/gruvbox_material_dark.theme\""
    want["theme_background"] = "true"
    want["truecolor"] = "true"
    want["vim_keys"] = "true"
    want["rounded_corners"] = "true"
    want["update_ms"] = "1100"
    want["save_config_on_exit"] = "true"
  }
  $1 in want { print $1 " = " want[$1]; seen[$1] = 1; next }
  { print }
  END { for (k in want) if (!(k in seen)) print k " = " want[k] }
'
