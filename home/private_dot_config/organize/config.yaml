# organize configuration file
# https://organize.readthedocs.io
#
# Only the root of ~/Downloads is sorted, by kind (not by extension).
# Hand-made subfolders are never touched. Anything left at the root for more
# than 7 days lands in Misc/, so rare extensions don't need their own folder.

rules:
  # --- sort by kind
  - name: "Documents"
    locations: &downloads ~/Downloads/
    filters:
      - extension: [pdf, doc, docx, odt, rtf, txt, md, xls, xlsx, ods, csv, ppt, pptx, odp]
    actions:
      - move: ~/Downloads/Documents/

  - name: "Books"
    locations: *downloads
    filters:
      - extension: [epub, mobi, azw3, m4b]
    actions:
      - move: ~/Downloads/Books/

  - name: "Images"
    locations: *downloads
    filters:
      - extension: [jpg, jpeg, png, gif, webp, svg, heic, dng, psd]
    actions:
      - move: ~/Downloads/Images/

  - name: "Audio"
    locations: *downloads
    filters:
      - extension: [mp3, wav, flac, ogg, aac, m4a, wma, mid]
    actions:
      - move: ~/Downloads/Audio/

  - name: "Videos"
    locations: *downloads
    filters:
      - extension: [mp4, mkv, mov, avi, webm]
    actions:
      - move: ~/Videos/

  # INFO: extension filter only sees the last suffix, tar.gz matches gz
  - name: "Archives"
    locations: *downloads
    filters:
      - extension: [zip, rar, 7z, tar, gz, tgz, xz, bz2, zst]
    actions:
      - move: ~/Downloads/Archives/

  - name: "Dev"
    locations: *downloads
    filters:
      - extension: [yaml, yml, json, toml, xml, sh, py, ipynb, patch, diff]
    actions:
      - move: ~/Downloads/Dev/

  - name: "3D"
    locations: *downloads
    filters:
      - extension: [stl, 3mf, stp, step, obj]
    actions:
      - move: ~/Downloads/3D/

  - name: "Installers"
    locations: *downloads
    filters:
      - extension: [exe, msi, deb, rpm, appimage]
    actions:
      - move: ~/Downloads/Installers/

  - name: "Fonts"
    locations: *downloads
    filters:
      - extension: [ttf, otf, woff, woff2]
    actions:
      - move: ~/Downloads/Fonts/

  - name: "Disk images"
    locations: *downloads
    filters:
      - extension: [iso, img]
    actions:
      - move: ~/Downloads/ISO/

  - name: "Torrents"
    locations: *downloads
    filters:
      - extension: torrent
    actions:
      - move: ~/Downloads/Torrents/

  # --- catch-all: root is a landing zone, leftovers go to Misc after 7 days
  - name: "Misc"
    locations:
      - path: ~/Downloads/
        exclude_files: [".*"]
    filters:
      - not extension: [part, crdownload, tmp]
      - lastmodified:
          days: 7
    actions:
      - move: ~/Downloads/Misc/

  # --- purge what is easy to download again
  - name: "Trash old torrents"
    locations: ~/Downloads/Torrents/
    filters:
      - lastmodified:
          days: 30
    actions:
      - trash

  - name: "Trash old disk images"
    locations: ~/Downloads/ISO/
    filters:
      - lastmodified:
          days: 90
    actions:
      - trash

  # INFO: only folders managed above, never hand-made ones (projects, archives)
  - name: "Trash duplicates"
    locations:
      - ~/Downloads/Documents/
      - ~/Downloads/Books/
      - ~/Downloads/Images/
      - ~/Downloads/Audio/
      - ~/Downloads/Archives/
      - ~/Downloads/Dev/
      - ~/Downloads/Installers/
      - ~/Downloads/Misc/
    filters:
      - duplicate:
          detect_original_by: created
    actions:
      - trash

  # --- screenshots
  - name: "Move grim captures to Pictures/screenCapture"
    locations: ~/Pictures
    filters:
      - name:
          contains: grim
    actions:
      - move: ~/Pictures/screenCapture/

  - name: "Delete old grim captures"
    locations: ~/Pictures/screenCapture
    filters:
      - created:
          months: 2
    actions:
      - delete

  - name: "Move CodeSnap captures to Pictures/codeSnap"
    locations: ~/Pictures
    filters:
      - name:
          contains: CodeSnap
    actions:
      - move: ~/Pictures/codeSnap/

  - name: "Delete old CodeSnap captures"
    locations: ~/Pictures/codeSnap
    filters:
      - created:
          months: 2
    actions:
      - delete
