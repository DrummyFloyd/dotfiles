#!/usr/bin/env bash

# ZapZap rewrites this Qt INI on every exit (window state, counters...),
# so only enforce downloads straight into ~/Downloads, sorted by organize.

awk -v path="${HOME}/Downloads" '
  function flush() {
    if (!seen_path) print "download_path=" path
    if (!seen_folder) print "folderDownloads=false"
    done = 1
  }
  /^\[/ { if (section == "[system]" && !done) flush(); section = $0 }
  section == "[system]" && /^download_path=/ { print "download_path=" path; seen_path = 1; next }
  section == "[system]" && /^folderDownloads=/ { print "folderDownloads=false"; seen_folder = 1; next }
  { print }
  END {
    if (done) exit
    if (section != "[system]") print "[system]"
    flush()
  }
'
